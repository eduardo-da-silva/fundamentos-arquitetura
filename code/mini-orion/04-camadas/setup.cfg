[importlinter]
root_package = mini_orion

# Cada contrato abaixo e uma decisao arquitetural tomada em aula,
# transformada em verificacao. Rode com:
#
#     lint-imports
#
# O contrato `layers` substitui os tres contratos por-modulo do
# checkpoint anterior: agora a regra e sobre camadas, nao sobre pares de
# modulos. `apresentacao` pode importar `aplicacao`, que pode importar
# `dominio` — nunca o contrario. Camadas fechadas: `apresentacao` nao
# pode pular `aplicacao` e falar direto com `dominio`.

[importlinter:contract:camadas]
name = Regra de dependencia: apresentacao > aplicacao > dominio
type = layers
layers =
    mini_orion.apresentacao
    mini_orion.aplicacao
    mini_orion.dominio

[importlinter:contract:dominio-nao-conhece-infra]
name = Dominio e aplicacao nao conhecem infraestrutura
type = forbidden
source_modules =
    mini_orion.dominio
    mini_orion.aplicacao
forbidden_modules =
    mini_orion.infraestrutura
