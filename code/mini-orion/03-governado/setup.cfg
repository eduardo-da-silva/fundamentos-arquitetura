[importlinter]
root_package = mini_orion

# Cada contrato abaixo e uma decisao arquitetural tomada em aula,
# transformada em verificacao. Rode com:
#
#     lint-imports
#
# Se alguem reintroduzir um dos imports proibidos, isto falha — na
# maquina de quem escreveu e na CI, antes do merge.

[importlinter:contract:checkout-depende-de-contratos]
name = Checkout nao pode depender de implementacoes de outros componentes
type = forbidden
source_modules =
    mini_orion.checkout
forbidden_modules =
    mini_orion.pagamentos
    mini_orion.notificacoes

[importlinter:contract:contratos-nao-dependem-de-implementacoes]
name = Contratos nao podem depender de nenhuma implementacao
type = forbidden
source_modules =
    mini_orion.contratos
forbidden_modules =
    mini_orion.checkout
    mini_orion.pagamentos
    mini_orion.notificacoes
    mini_orion.pedidos

[importlinter:contract:sem-ciclos]
name = Nenhum ciclo de dependencia entre componentes
type = independence
modules =
    mini_orion.pagamentos
    mini_orion.notificacoes
    mini_orion.pedidos
